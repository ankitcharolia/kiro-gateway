[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "kiro-gateway"
dynamic = ["version"]
description = "OpenAI & Anthropic-compatible API gateway for Kiro (single-account, compliance-mode)"
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "kiro",
    "kiro-cli",
    "ai-gateway",
    "llm-gateway",
    "openai-api",
    "anthropic-api",
    "openai-compatible",
    "anthropic-compatible",
    "agent-client-protocol",
    "mcp",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    # PDF document text extraction for image/document inputs (issue #33).
    "pypdf>=4",
]

[project.urls]
Homepage = "https://github.com/ankitcharolia/kiro-gateway#quick-start"
Repository = "https://github.com/ankitcharolia/kiro-gateway"
Issues = "https://github.com/ankitcharolia/kiro-gateway/issues"
Changelog = "https://github.com/ankitcharolia/kiro-gateway/blob/main/CHANGELOG.md"

[project.scripts]
kiro-gateway = "kiro.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# hatch-vcs: derive package version from git tags (e.g. v1.2.0 -> "1.2.0").
# Running `uv sync` in a git repo with tags sets the installed package
# version automatically.
# Outside of a git repo (e.g. Docker build from sdist), hatch-vcs writes
# the resolved version into kiro/_version.py at build time.
# ---------------------------------------------------------------------------
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

# ---------------------------------------------------------------------------
# Hatchling build config
# The project is called "kiro-gateway" but the importable package lives in
# the "kiro/" directory.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["kiro"]

[tool.hatch.build.targets.sdist]
include = [
    "kiro/",
    "main.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast, no I/O",
    "integration: requires kiro CLI",
    "streaming: async streaming tests",
]
addopts = "-v --tb=short -p no:warnings"
